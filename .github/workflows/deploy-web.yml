name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.5
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      # .nojekyll keeps Pages from dropping Flutter files; 404.html lets deep links load the app.
      - run: touch build/web/.nojekyll && cp build/web/index.html build/web/404.html

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          publish_branch: gh-pages
          force_orphan: true
